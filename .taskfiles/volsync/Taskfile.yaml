---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# This taskfile is used to manage certain VolSync tasks for a given application, limitations are described below.
#   1. Flux Kustomization, HelmRelease, PVC and controller are all named after the app (e.g. plex),
#      and the Flux Kustomization lives in the app's namespace
#   2. Each app has two ReplicationSources, <app>-local and <app>-remote, each with its own restic
#      secret, <app>-volsync-local-secret and <app>-volsync-remote-secret (kubernetes/components/volsync)
#   3. Applications are deployed as either a Kubernetes Deployment or StatefulSet
#   4. Each application only has one PVC that is being replicated
# Every task takes repo=local|remote (default: local) to pick the restic repository.

x-env: &env
  app: '{{.app}}'
  repo: '{{.repo}}'
  controller: '{{.controller}}'
  replicas: '{{.replicas}}'
  claim: '{{.claim}}'
  puid: '{{.puid}}'
  pgid: '{{.pgid}}'
  cache_sc: '{{.cache_sc}}'
  cache_capacity: '{{.cache_capacity}}'
  cache_access_mode: '{{.cache_access_mode}}'
  ns: '{{.ns}}'
  previous: '{{.previous}}'
  ts: '{{.ts}}'

vars:
  scriptsDir: '{{.ROOT_DIR}}/.taskfiles/volsync/scripts'
  templatesDir: '{{.ROOT_DIR}}/.taskfiles/volsync/templates'
  ts: '{{now | date "150405"}}'

tasks:
  list:
    desc: List snapshots for an application
    summary: |
      Args:
        cluster: Cluster to run command against (required)
        ns: Namespace the PVC is in (default: default)
        app: Application to list snapshots for (required)
        repo: Which repository to list, local or remote (default: local)
    cmds:
      - envsubst < <(cat {{.templatesDir}}/list.tmpl.yaml) | kubectl --context {{.cluster}} apply -f -
      - bash {{.scriptsDir}}/job.sh list-{{.app}}-{{.repo}}-{{.ts}} {{.ns}} {{.cluster}} list 300
    env: *env
    vars:
      cluster: '{{ or .cluster (fail "Argument (cluster) is required") }}'
      ns: '{{.ns | default "default"}}'
      app: '{{ or .app (fail "Argument (app) is required") }}'
      repo: '{{.repo | default "local"}}'
    preconditions:
      - { msg: "repo must be local or remote", sh: 'test "{{.repo}}" = local -o "{{.repo}}" = remote' }
      - { msg: "Job script not found", sh: "test -f {{.scriptsDir}}/job.sh" }
      - { msg: "List template not found", sh: "test -f {{.templatesDir}}/list.tmpl.yaml" }
      - { msg: "Restic secret {{.app}}-volsync-{{.repo}}-secret not found", sh: "kubectl --context {{.cluster}} -n {{.ns}} get secret {{.app}}-volsync-{{.repo}}-secret" }
    silent: true

  unlock-all:
    desc: Unlock the local and the remote Restic repository for an application
    cmds:
      - task: unlock
        vars: { repo: local }
      - task: unlock
        vars: { repo: remote }

  unlock:
    desc: Unlock a Restic repository for an application
    summary: |
      Args:
        cluster: Cluster to run command against (required)
        ns: Namespace the PVC is in (default: default)
        app: Application to unlock (required)
        repo: Which repository to unlock, local or remote (default: local)
    cmds:
      - envsubst < <(cat {{.templatesDir}}/unlock.tmpl.yaml) | kubectl --context {{.cluster}} apply -f -
      - bash {{.scriptsDir}}/job.sh unlock-{{.app}}-{{.repo}}-{{.ts}} {{.ns}} {{.cluster}} unlock 300
    env: *env
    vars:
      cluster: '{{ or .cluster (fail "Argument (cluster) is required") }}'
      ns: '{{.ns | default "default"}}'
      app: '{{ or .app (fail "Argument (app) is required") }}'
      repo: '{{.repo | default "local"}}'
    preconditions:
      - { msg: "repo must be local or remote", sh: 'test "{{.repo}}" = local -o "{{.repo}}" = remote' }
      - { msg: "Job script not found", sh: "test -f {{.scriptsDir}}/job.sh" }
      - { msg: "Unlock template not found", sh: "test -f {{.templatesDir}}/unlock.tmpl.yaml" }
      - { msg: "Restic secret {{.app}}-volsync-{{.repo}}-secret not found", sh: "kubectl --context {{.cluster}} -n {{.ns}} get secret {{.app}}-volsync-{{.repo}}-secret" }
    silent: true

  # The remote repository is on S3 (Cloudflare R2); kept for the old name
  unlock-s3:
    desc: Unlock the remote Restic repository for an application (same as unlock repo=remote)
    cmds:
      - task: unlock
        vars: { repo: remote }

  # ReplicationSources in this cluster are named <app>-local and <app>-remote.
  snapshot:
    desc: Snapshot a PVC for an application
    summary: |
      Args:
        cluster: Cluster to run command against (required)
        ns: Namespace the PVC is in (default: default)
        app: Application to snapshot (required)
        repo: Which backup to run, local or remote (default: local)
    cmds:
      - kubectl --context {{.cluster}} -n {{.ns}} patch replicationsources {{.source}} --type merge -p '{"spec":{"trigger":{"manual":"{{.trigger}}"}}}'
      # Flux may already have removed the manual trigger, so a failed cleanup is fine
      - defer: kubectl --context {{.cluster}} -n {{.ns}} patch replicationsources {{.source}} --type json -p '[{"op":"remove","path":"/spec/trigger/manual"}]' >/dev/null 2>&1 || true
      # Wait on lastSyncTime rather than lastManualSync: Flux can strip the manual
      # trigger mid-backup, which leaves lastManualSync empty forever.
      # A failed mover never moves lastSyncTime, so also stop when this run failed:
      #  - latestMoverStatus turns Failed and differs from what it was before the trigger, or
      #  - a mover Job we saw on its last retry is replaced while latestMoverStatus says Failed
      #    (VolSync gives up on a Job after backoffLimit failures, records Failed, then starts
      #    a new Job). This catches a repeat of the same failure, whose status looks the same
      #    as the old one. A Job replaced earlier (VolSync does that when the spec changes)
      #    does not count.
      # VolSync only gives up after about 20 min of retries, so each failed attempt is shown.
      - |
        echo "Waiting for {{.source}} to finish a new backup (last one: {{.lastSync}})"
        # Task's shell exits on a failed command substitution: lookups that may
        # legitimately fail (no mover Job between runs) end in `|| true`
        k() { kubectl --context {{.cluster}} -n {{.ns}} "$@"; }
        fail() {
          echo "Backup failed:"
          k get replicationsources {{.source}} -o jsonpath='{.status.latestMoverStatus.logs}{"\n"}'
          exit 1
        }
        done=""
        job_uid=""
        last_try_uid=""
        seen=0
        for i in $(seq 1 720); do
          now="$(k get replicationsources {{.source}} -o jsonpath='{.status.lastSyncTime}')"
          if [ "$now" != "{{.lastSync}}" ]; then done="$now"; break; fi
          result="$(k get replicationsources {{.source}} -o jsonpath='{.status.latestMoverStatus.result}')"
          status="$(k get replicationsources {{.source}} -o jsonpath='{.status.latestMoverStatus}')"
          if [ "$result" = "Failed" ] && [ "$(printf '%s' "$status" | sha256sum | cut -c1-16)" != "{{.lastMover}}" ]; then fail; fi
          uid="$(k get job volsync-src-{{.source}} -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
          if [ -n "$last_try_uid" ] && [ "$uid" != "$last_try_uid" ] && [ "$result" = "Failed" ]; then fail; fi
          if [ "$uid" != "$job_uid" ]; then job_uid="$uid"; seen=0; fi
          failed="$(k get job volsync-src-{{.source}} -o jsonpath='{.status.failed}' 2>/dev/null || true)"
          if [ -n "$uid" ] && [ "${failed:-0}" -gt "$seen" ]; then
            seen="$failed"
            limit="$(k get job volsync-src-{{.source}} -o jsonpath='{.spec.backoffLimit}' 2>/dev/null || true)"
            # 10s polls can miss the final count, so the attempt before the last one counts too
            if [ "$failed" -ge "$(( ${limit:-8} - 1 ))" ]; then last_try_uid="$uid"; fi
            pod="$(k get pods -l job-name=volsync-src-{{.source}} --field-selector=status.phase=Failed --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -n1 || true)"
            echo "Mover attempt $failed failed, VolSync will retry. Last lines of $pod:"
            k logs "$pod" --tail=5 2>/dev/null | sed 's/^/  /' || true
          fi
          sleep 10
        done
        if [ -z "$done" ]; then echo "Timed out after 2h waiting for a new backup"; exit 1; fi
        echo "Backup finished at $done"
      - kubectl --context {{.cluster}} -n {{.ns}} get replicationsources {{.source}} -o jsonpath='{.status.latestMoverStatus.result}{"\n"}{.status.latestMoverStatus.logs}{"\n"}'
      - test "$(kubectl --context {{.cluster}} -n {{.ns}} get replicationsources {{.source}} -o jsonpath='{.status.latestMoverStatus.result}')" = "Successful"
    vars:
      cluster: '{{ or .cluster (fail "Argument (cluster) is required") }}'
      ns: '{{.ns | default "default"}}'
      app: '{{ or .app (fail "Argument (app) is required") }}'
      repo: '{{.repo | default "local"}}'
      source: '{{.app}}-{{.repo}}'
      trigger: '{{now | unixEpoch}}'
      lastSync:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources {{.source}} -o jsonpath='{.status.lastSyncTime}'
      # Fingerprint of the mover status before the trigger, so an old failure does not count
      lastMover:
        sh: printf '%s' "$(kubectl --context {{.cluster}} -n {{.ns}} get replicationsources {{.source}} -o jsonpath='{.status.latestMoverStatus}')" | sha256sum | cut -c1-16
    preconditions:
      - { msg: "repo must be local or remote", sh: 'test "{{.repo}}" = local -o "{{.repo}}" = remote' }
      - { msg: "ReplicationSource not found", sh: "kubectl --context {{.cluster}} -n {{.ns}} get replicationsources {{.source}}" }
    silent: true

  # Restore wipes the PVC and fills it from restic. The app stays suspended (Flux and
  # replicas 0) if the wipe or the restore fails, so it never starts on an empty volume.
  # To restore every app from its local repository, 4 at a time:
  #    - kubectl get replicationsources -A --no-headers | awk '$2 ~ /-local$/ {sub(/-local$/, "", $2); print $2, $1}' | xargs --max-procs=4 -l bash -c 'task volsync:restore cluster=<context> app=$0 ns=$1'
  restore:
    desc: Restore a PVC for an application (wipes the PVC first)
    summary: |
      Args:
        cluster: Cluster to run command against (required)
        ns: Namespace the PVC is in (default: default)
        app: Application to restore (required)
        repo: Which repository to restore from, local or remote (default: local)
        previous: Snapshots to skip, newest first; 0 is the latest snapshot (default: 2)
    cmds:
      - task: .suspend
        vars: *env
      - task: .wipe
        vars: *env
      - task: .restore
        vars: *env
      - task: .resume
        vars: *env
    env: *env
    vars:
      cluster: '{{ or .cluster (fail "Argument (cluster) is required") }}'
      ns: '{{.ns | default "default"}}'
      app: '{{ or .app (fail "Argument (app) is required") }}'
      repo: '{{.repo | default "local"}}'
      source: '{{.app}}-{{.repo}}'
      previous: '{{.previous | default 2}}'
      controller:
        sh: "{{.scriptsDir}}/controller.sh {{.app}} {{.ns}} {{.cluster}}"
      replicas:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get {{.controller}} -o jsonpath="{.spec.replicas}"
      claim:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources/{{.source}} -o jsonpath="{.spec.sourcePVC}"
      puid:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources/{{.source}} -o jsonpath="{.spec.restic.moverSecurityContext.runAsUser}"
      pgid:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources/{{.source}} -o jsonpath="{.spec.restic.moverSecurityContext.runAsGroup}"
      cache_sc:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources/{{.source}} -o jsonpath="{.spec.restic.cacheStorageClassName}"
      cache_capacity:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources/{{.source}} -o jsonpath="{.spec.restic.cacheCapacity}"
      cache_access_mode:
        sh: kubectl --context {{.cluster}} -n {{.ns}} get replicationsources/{{.source}} -o jsonpath="{.spec.restic.cacheAccessModes[0]}"
    preconditions:
      - { msg: "repo must be local or remote", sh: 'test "{{.repo}}" = local -o "{{.repo}}" = remote' }
      - { msg: "Controller script not found", sh: "test -f {{.scriptsDir}}/controller.sh" }
      - { msg: "Job script not found", sh: "test -f {{.scriptsDir}}/job.sh" }
      - { msg: "ReplicationDestination template not found", sh: "test -f {{.templatesDir}}/replicationdestination.tmpl.yaml" }
      - { msg: "Wipe template not found", sh: "test -f {{.templatesDir}}/wipe.tmpl.yaml" }
      - { msg: "ReplicationSource {{.source}} not found", sh: "kubectl --context {{.cluster}} -n {{.ns}} get replicationsources {{.source}}" }
      - { msg: "Restic secret {{.app}}-volsync-{{.repo}}-secret not found", sh: "kubectl --context {{.cluster}} -n {{.ns}} get secret {{.app}}-volsync-{{.repo}}-secret" }
      - { msg: "Could not read the PVC, mover uid/gid or cache settings from {{.source}}", sh: 'test -n "{{.claim}}" -a -n "{{.puid}}" -a -n "{{.pgid}}" -a -n "{{.cache_sc}}" -a -n "{{.cache_capacity}}" -a -n "{{.cache_access_mode}}"' }

  # Suspend the Flux ks and hr (both live in the app's namespace), then stop the app
  .suspend:
    internal: true
    cmds:
      - flux --context {{.cluster}} -n {{.ns}} suspend kustomization {{.app}}
      - flux --context {{.cluster}} -n {{.ns}} suspend helmrelease {{.app}}
      - kubectl --context {{.cluster}} -n {{.ns}} scale {{.controller}} --replicas 0
      - kubectl --context {{.cluster}} -n {{.ns}} wait pod --for delete --selector="app.kubernetes.io/name={{.app}}" --timeout=2m
    env: *env

  # Wipe the PVC of all data
  .wipe:
    internal: true
    cmds:
      - envsubst < <(cat {{.templatesDir}}/wipe.tmpl.yaml) | kubectl --context {{.cluster}} apply -f -
      - bash {{.scriptsDir}}/job.sh wipe-{{.app}}-{{.ts}} {{.ns}} {{.cluster}} wipe 7200
    env: *env

  # Create VolSync replicationdestination CR to restore data
  .restore:
    internal: true
    cmds:
      - envsubst < <(cat {{.templatesDir}}/replicationdestination.tmpl.yaml) | kubectl --context {{.cluster}} apply -f -
      # VolSync retries a failed mover, then records the result in latestMoverStatus
      - |
        rd="replicationdestination/{{.app}}-{{.ts}}"
        echo "Waiting for $rd to restore {{.claim}} from {{.repo}}"
        result=""
        for i in $(seq 1 720); do
          result="$(kubectl --context {{.cluster}} -n {{.ns}} get "$rd" -o jsonpath='{.status.latestMoverStatus.result}')"
          [ -n "$result" ] && break
          sleep 10
        done
        kubectl --context {{.cluster}} -n {{.ns}} get "$rd" -o jsonpath='{.status.latestMoverStatus.logs}{"\n"}'
        kubectl --context {{.cluster}} -n {{.ns}} delete "$rd"
        if [ "$result" != "Successful" ]; then
          echo "Restore ${result:-timed out after 2h}. {{.app}} stays suspended with replicas 0; its PVC may be empty." >&2
          exit 1
        fi
    env: *env

  # Resume Flux ks and hr, then bring the app back to its replica count from before the restore
  # (helm-controller does not scale it back by itself when nothing in the release changed)
  .resume:
    internal: true
    cmds:
      - flux --context {{.cluster}} -n {{.ns}} resume helmrelease {{.app}}
      - flux --context {{.cluster}} -n {{.ns}} resume kustomization {{.app}}
      - kubectl --context {{.cluster}} -n {{.ns}} scale {{.controller}} --replicas {{.replicas}}
    env: *env
