---
apiVersion: batch/v1
kind: Job
metadata:
  name: "list-${app}-${repo}-${ts}"
  namespace: "${ns}"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: list
          image: docker.io/restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
          args: ["snapshots"]
          envFrom:
            - secretRef:
                name: "${app}-volsync-${repo}-secret"
