---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: "${app}-${ts}"
  namespace: "${ns}"
spec:
  trigger:
    manual: restore-once
  restic:
    repository: "${app}-volsync-${repo}-secret"
    destinationPVC: "${claim}"
    copyMethod: Direct
    # The cluster has no default StorageClass, so the cache volume needs these;
    # they are copied from the app's ReplicationSource
    cacheStorageClassName: "${cache_sc}"
    cacheCapacity: "${cache_capacity}"
    cacheAccessModes: ["${cache_access_mode}"]
    cleanupCachePVC: true
    # IMPORTANT NOTE:
    #   Number of snapshots to skip, newest first: 0 restores the latest one
    previous: ${previous}
    # OR;
    # IMPORTANT NOTE:
    #   On bootstrap set `restoreAsOf` to the time the old cluster was destroyed.
    #   This will essentially prevent volsync from trying to restore a backup
    #   from a application that started with default data in the PVC.
    #   Do not restore snapshots made after the following RFC3339 Timestamp.
    #   date --rfc-3339=seconds (--utc)
    # restoreAsOf: "2022-12-10T16:00:00-05:00"
    moverSecurityContext:
      runAsUser: ${puid}
      runAsGroup: ${pgid}
      fsGroup: ${pgid}
