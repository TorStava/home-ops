---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  # The script lives in scripts/plex-courses (README there); Flux builds with LoadRestrictionsNone.
  - name: plex-courses-script
    files:
      - plex_courses.py=../../../../../scripts/plex-courses/plex_courses.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled  # Python source, not a template
