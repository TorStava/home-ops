---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: recyclarr-configmap
    files:
      - recyclarr.yml=./resources/recyclarr.yaml
      - settings.yml=./resources/settings.yaml
      - radarr-not-mkv.json=./resources/custom-formats/radarr-not-mkv.json
      - sonarr-not-mkv.json=./resources/custom-formats/sonarr-not-mkv.json
generatorOptions:
  disableNameSuffixHash: true