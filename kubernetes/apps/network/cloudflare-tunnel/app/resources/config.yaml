---
originRequest:
  originServerName: "external.${SECRET_DOMAIN}"
  noTLSVerify: true
  disableChunkedEncoding: true

ingress:
  - hostname: "${SECRET_DOMAIN}"
    service: &svc https://cilium-gateway-external.kube-system.svc.cluster.local
  - hostname: "*.${SECRET_DOMAIN}"
    service: *svc
  # Second zone: apex only. www and the .com names redirect at Cloudflare.
  # SNI must match the apex listener, not the default external.<domain>.
  - hostname: "${SECRET_DOMAIN_SLEKTLY}"
    service: *svc
    originRequest:
      originServerName: "${SECRET_DOMAIN_SLEKTLY}"
  # Afterword's own domain: apex only, same SNI rule as above.
  - hostname: "${SECRET_DOMAIN_AFTERWORD}"
    service: *svc
    originRequest:
      originServerName: "${SECRET_DOMAIN_AFTERWORD}"
  # Turvis: every subdomain (app, auth). One originServerName serves all names the
  # rule matches, so it is a concrete name that the wildcard listener covers; the
  # HTTPRoute still matches on the Host header, which cloudflared leaves alone.
  - hostname: "*.${SECRET_DOMAIN_TURVIS}"
    service: *svc
    originRequest:
      originServerName: "app.${SECRET_DOMAIN_TURVIS}"
  - service: http_status:404
