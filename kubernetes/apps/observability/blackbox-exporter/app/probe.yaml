---
# yaml-language-server: $schema=https://schemas.tholinka.dev/monitoring.coreos.com/probe_v1.json
# Feeds probe_success{instance=~".+:2049"} consumed by components/keda/nfs-scaler,
# which gates NFS-backed apps' KEDA ScaledObjects on NAS reachability.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nas-nfs
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-nfs
  interval: 60s
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - ${NAS_IP}:2049
