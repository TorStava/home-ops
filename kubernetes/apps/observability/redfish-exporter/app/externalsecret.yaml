---
# Bitwarden Secrets Manager item: ilo-redfish
# Fields: REDFISH_USERNAME, REDFISH_PASSWORD (same account on every iLO; each target in
# scrapeconfig.yaml needs its own entry under hosts below)
#
# iLO account: ReadOnly (or Operator) is sufficient — exporter only performs Redfish GETs.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redfish-exporter
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: redfish-exporter-config
    template:
      data:
        config.yml: |
          loglevel: info
          # One entry per iLO in scrapeconfig.yaml, keyed exactly as the scrape's target.
          # No `default` entry: the exporter then answers any other target without
          # logging in anywhere ("no credentials found for target").
          hosts:
            "192.168.1.190":
              username: "{{ .REDFISH_USERNAME }}"
              password: "{{ .REDFISH_PASSWORD }}"
            "192.168.1.191":
              username: "{{ .REDFISH_USERNAME }}"
              password: "{{ .REDFISH_PASSWORD }}"
  dataFrom:
    - extract:
        key: ilo-redfish
