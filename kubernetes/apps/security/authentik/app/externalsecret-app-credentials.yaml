---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-app-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-app-credentials
    template:
      # Only these keys reach the Authentik pods. Blueprints in
      # resources/blueprints/apps/ read them with !Env.
      # Per app: AK_<SLUG>_CLIENT_ID / AK_<SLUG>_CLIENT_SECRET, mapped from the
      # app's own Bitwarden item, which stays the single source of the credentials.
      data:
        AK_PGADMIN_CLIENT_ID: '{{ .PGADMIN_CLIENT_ID }}'
        AK_PGADMIN_CLIENT_SECRET: '{{ .PGADMIN_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        key: pgadmin
