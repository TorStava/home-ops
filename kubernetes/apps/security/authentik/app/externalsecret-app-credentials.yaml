---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-app-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-app-credentials
    template:
      # Only these keys reach the Authentik pods. Blueprints in
      # resources/blueprints/apps/ read them with !Env.
      # Per app: AK_<SLUG>_CLIENT_ID / AK_<SLUG>_CLIENT_SECRET, mapped from the
      # app's own Bitwarden item, which stays the single source of the credentials.
      # Each extract below is prefixed with its item name (rewrite), so items
      # that share a key name (e.g. OAUTH_CLIENT_ID) cannot overwrite each other.
      data:
        AK_ACTUAL_BUDGET_CLIENT_ID: '{{ .actual_ACTUAL_OPENID_CLIENT_ID }}'
        AK_ACTUAL_BUDGET_CLIENT_SECRET: '{{ .actual_ACTUAL_OPENID_CLIENT_SECRET }}'
        AK_FORGEJO_CLIENT_ID: '{{ .forgejo_OAUTH_CLIENT_ID }}'
        AK_FORGEJO_CLIENT_SECRET: '{{ .forgejo_OAUTH_CLIENT_SECRET }}'
        AK_FRESHRSS_CLIENT_ID: '{{ .freshrss_OIDC_CLIENT_ID }}'
        AK_FRESHRSS_CLIENT_SECRET: '{{ .freshrss_OIDC_CLIENT_SECRET }}'
        AK_IMMICH_CLIENT_ID: '{{ .immich_IMMICH_OAUTH_CLIENT_ID }}'
        AK_IMMICH_CLIENT_SECRET: '{{ .immich_IMMICH_OAUTH_CLIENT_SECRET }}'
        AK_KARAKEEP_CLIENT_ID: '{{ .karakeep_OAUTH_CLIENT_ID }}'
        AK_KARAKEEP_CLIENT_SECRET: '{{ .karakeep_OAUTH_CLIENT_SECRET }}'
        AK_KOMGA_CLIENT_ID: '{{ .komga_KOMGA_AUTHENTIK_CLIENT_ID }}'
        AK_KOMGA_CLIENT_SECRET: '{{ .komga_KOMGA_AUTHENTIK_CLIENT_SECRET }}'
        AK_LINKWARDEN_CLIENT_ID: '{{ .linkwarden_AUTHENTIK_CLIENT_ID }}'
        AK_LINKWARDEN_CLIENT_SECRET: '{{ .linkwarden_AUTHENTIK_CLIENT_SECRET }}'
        AK_NODE_RED_CLIENT_ID: '{{ .node_red_NODE_RED_OAUTH_CLIENT_ID }}'
        AK_NODE_RED_CLIENT_SECRET: '{{ .node_red_NODE_RED_OAUTH_CLIENT_SECRET }}'
        AK_OUTLINE_CLIENT_ID: '{{ .outline_OAUTH_CLIENT_ID }}'
        AK_OUTLINE_CLIENT_SECRET: '{{ .outline_OAUTH_CLIENT_SECRET }}'
        AK_PAPERLESS_CLIENT_ID: '{{ .paperless_PAPERLESS_OAUTH_CLIENT_ID }}'
        AK_PAPERLESS_CLIENT_SECRET: '{{ .paperless_PAPERLESS_OAUTH_CLIENT_SECRET }}'
        AK_PENPOT_CLIENT_ID: '{{ .penpot_PENPOT_OIDC_CLIENT_ID }}'
        AK_PENPOT_CLIENT_SECRET: '{{ .penpot_PENPOT_OIDC_CLIENT_SECRET }}'
        AK_PGADMIN_CLIENT_ID: '{{ .pgadmin_PGADMIN_CLIENT_ID }}'
        AK_PGADMIN_CLIENT_SECRET: '{{ .pgadmin_PGADMIN_CLIENT_SECRET }}'
        AK_TANDOOR_CLIENT_ID: '{{ .tandoor_OAUTH_CLIENT_ID }}'
        AK_TANDOOR_CLIENT_SECRET: '{{ .tandoor_OAUTH_CLIENT_SECRET }}'
        AK_VIKUNJA_CLIENT_ID: '{{ .vikunja_OAUTH_CLIENT_ID }}'
        AK_VIKUNJA_CLIENT_SECRET: '{{ .vikunja_OAUTH_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        key: actual
      rewrite:
        - regexp:
            source: "(.*)"
            target: "actual_$1"
    - extract:
        key: forgejo
      rewrite:
        - regexp:
            source: "(.*)"
            target: "forgejo_$1"
    - extract:
        key: freshrss
      rewrite:
        - regexp:
            source: "(.*)"
            target: "freshrss_$1"
    - extract:
        key: immich
      rewrite:
        - regexp:
            source: "(.*)"
            target: "immich_$1"
    - extract:
        key: karakeep
      rewrite:
        - regexp:
            source: "(.*)"
            target: "karakeep_$1"
    - extract:
        key: komga
      rewrite:
        - regexp:
            source: "(.*)"
            target: "komga_$1"
    - extract:
        key: linkwarden
      rewrite:
        - regexp:
            source: "(.*)"
            target: "linkwarden_$1"
    - extract:
        key: node-red
      rewrite:
        - regexp:
            source: "(.*)"
            target: "node_red_$1"
    - extract:
        key: outline
      rewrite:
        - regexp:
            source: "(.*)"
            target: "outline_$1"
    - extract:
        key: paperless
      rewrite:
        - regexp:
            source: "(.*)"
            target: "paperless_$1"
    - extract:
        key: penpot
      rewrite:
        - regexp:
            source: "(.*)"
            target: "penpot_$1"
    - extract:
        key: pgadmin
      rewrite:
        - regexp:
            source: "(.*)"
            target: "pgadmin_$1"
    - extract:
        key: tandoor
      rewrite:
        - regexp:
            source: "(.*)"
            target: "tandoor_$1"
    - extract:
        key: vikunja
      rewrite:
        - regexp:
            source: "(.*)"
            target: "vikunja_$1"
