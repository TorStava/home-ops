# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: App - gods-eye
  labels:
    blueprints.goauthentik.io/description: gods-eye proxy provider (embedded outpost), application and its access-group binding
entries:
  # Groups must exist before the binding below can find them.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: mounted/cm-authentik-blueprints/access-groups.yaml
      required: true

  # Proxy provider: Authentik manages its client credentials and redirect URIs
  # (derived from external_host); only the embedded outpost uses them.
  # outposts.yaml puts it on the embedded outpost.
  - model: authentik_providers_proxy.proxyprovider
    id: provider
    identifiers:
      name: Provider for Gods Eye
    attrs:
      mode: proxy
      external_host: https://godseye.${SECRET_DOMAIN}
      internal_host: http://gods-eye-view.self-hosted.svc.cluster.local:4173
      internal_host_ssl_validation: true
      intercept_header_auth: true
      basic_auth_enabled: false
      access_token_validity: hours=24
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]

  - model: authentik_core.application
    id: app
    identifiers:
      slug: gods-eye
    attrs:
      name: Gods Eye
      provider: !KeyOf provider
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, Operators]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
