# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: App - Komga
  labels:
    blueprints.goauthentik.io/description: Komga OAuth2 provider, verified-email mapping, application and its access-group binding
entries:
  # Groups must exist before the binding below can find them.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: mounted/cm-authentik-blueprints/access-groups.yaml
      required: true

  # Komga refuses users whose email is not verified, and the default email
  # mapping always says false. Users cannot change their own email here
  # (System > Settings > "Allow users to change email" is off), so the address
  # is admin-set and can be trusted.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: Komga - email (verified)
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Provider for Komga
    attrs:
      client_type: confidential
      # From the authentik-app-credentials ExternalSecret (Bitwarden item: komga)
      client_id: !Env AK_KOMGA_CLIENT_ID
      client_secret: !Env AK_KOMGA_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf scope-email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://komga.${SECRET_DOMAIN}/login/oauth2/code/authentik
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true

  - model: authentik_core.application
    id: app
    identifiers:
      slug: komga
    attrs:
      name: Komga
      provider: !KeyOf provider
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, Household]]
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
