# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Social login (Google)
  labels:
    blueprints.goauthentik.io/description: Google login, linked by email, no self-enrollment on the default login page
entries:
  # No self-enrollment: enrollment_flow is left unset (none), so a Google
  # account whose email matches no existing user is refused and never created.
  # An admin creates the user; on the first Google login Authentik links it to
  # the user with the same email ("email_link"). Authentik does not check
  # Google's verified_email, so this relies on Google: use @gmail.com
  # addresses, or only domains we control (a lapsed custom domain can be
  # re-registered and its address minted on a new Google account). Matching is
  # exact and case-sensitive, and the first match wins: keep emails lowercase
  # and unique. Do not reuse this mode for other providers without checking.
  - model: authentik_sources_oauth.oauthsource
    id: source-google
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      enabled: true
      consumer_key: !Env GOOGLE_CLIENT_ID
      consumer_secret: !Env GOOGLE_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      user_matching_mode: email_link
  # Show the Google button on the default login page. `sources` is replaced as a
  # whole, so any source added by hand to this stage must be listed here too.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf source-google
