---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app afterword
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://${APP}:{{ .POSTGRES_PASSWORD }}@postgres-cluster-rw.database.svc.cluster.local:5432/${APP}"
        TICK_SECRET: "{{ .TICK_SECRET }}"
        SETUP_TOKEN: "{{ .SETUP_TOKEN }}"
        # Release and notice email goes out through Scaleway TEM SMTP (Postmark retired). The login is
        # the Project ID and the secret key of an API key whose IAM policy allows sending and reading
        # emails (bounce checks), from the verified afterword.no domain.
        MAIL_PROVIDER: scaleway-smtp
        SMTP_USER: "{{ .PROJECT_ID }}"
        SMTP_PASSWORD: "{{ .SECRET_KEY }}"
        EMAIL_FROM: "Afterword <afterword@afterword.no>"
  dataFrom:
    - extract:
        key: *app
    - extract:
        key: scaleway-tem-afterword
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret afterword-initdb
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: afterword
    - extract:
        key: cloudnative_pg
---
# The image is private (TorStava/afterword is a private repo): pull it with a read:packages token.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret afterword-ghcr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "TorStava:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: afterword
