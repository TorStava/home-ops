---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app afterword
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            env:
              INIT_POSTGRES_DBNAME: *app
              INIT_POSTGRES_HOST: postgres-cluster-rw.database.svc.cluster.local
              INIT_POSTGRES_USER: *app
            envFrom:
              - secretRef:
                  name: afterword-initdb
          migrate:
            image: &image
              repository: ghcr.io/torstava/afterword
              tag: sha-b7e4554@sha256:5ab97c2075fdd8e122953b2b95921d55bc417630adfd6b5d36e266984d4cec02
            command: ["node", "migrate.mjs"]
            envFrom:
              - secretRef:
                  name: *app
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            env:
              PORT: &port 3000
              PUBLIC_BASE_URL: "https://${SECRET_DOMAIN_AFTERWORD}"
              # The passkey RP ID is the host of PUBLIC_BASE_URL (WEBAUTHN_RP_ID is unset, so it follows).
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 20m
                memory: 192Mi
              limits:
                memory: 1Gi # letters up to 100 MB pass through memory on upload and release
            securityContext: *securityContext
      # The tick (ADR 0002): nudges, warnings, release, purge and reminders all happen here.
      tick:
        type: cronjob
        cronjob:
          schedule: "*/5 * * * *"
          concurrencyPolicy: Forbid
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 3
          ttlSecondsAfterFinished: 3600
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command: ["sh", "-c"]
            args:
              - >-
                curl -fsS --max-time 240 -X POST
                -H "Authorization: Bearer $TICK_SECRET"
                http://afterword.self-hosted.svc.cluster.local:3000/api/tick
            env:
              TICK_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: *app
                    key: TICK_SECRET
            securityContext: *securityContext
            resources:
              requests:
                cpu: 5m
        pod:
          restartPolicy: Never
    defaultPodOptions:
      imagePullSecrets:
        - name: afterword-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      next-cache:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /app/.next/cache
      tmp:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /tmp
    # Public: recipients' download links, /open, and check-in links from the owner's phone.
    route:
      app:
        hostnames: ["${SECRET_DOMAIN_AFTERWORD}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https-afterword
