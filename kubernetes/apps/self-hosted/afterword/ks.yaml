---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app afterword
  namespace: &namespace self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # /health/tick fails when the tick CronJob stops: then nothing is nudged, warned or released.
    - ../../../../components/gatus/external
  dependsOn:
    - name: postgres-cluster
      namespace: database
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/self-hosted/afterword/app
  postBuild:
    substitute:
      APP: *app
      GATUS_PATH: /health/tick
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
