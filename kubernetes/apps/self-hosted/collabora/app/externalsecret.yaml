---
# Admin-console password, generated once in-cluster (no Bitwarden item to create by hand).
# yaml-language-server: $schema=https://schemas.tholinka.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-admin
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-admin
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        username: admin
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-admin
---
# Mirror the credentials to Bitwarden (new key "collabora") so they can be looked up there.
# Whole JSON object, no `property`, so the write can never clobber other fields.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ${APP}-admin
spec:
  updatePolicy: Replace
  secretStoreRefs:
    - name: bitwarden
      kind: ClusterSecretStore
  selector:
    secret:
      name: ${APP}-admin
  template:
    engineVersion: v2
    data:
      bitwarden: '{{ dict "ADMIN_USERNAME" (.username | toString) "ADMIN_PASSWORD" (.password | toString) | toJson }}'
  data:
    - match:
        secretKey: bitwarden
        remoteRef:
          remoteKey: ${APP}
