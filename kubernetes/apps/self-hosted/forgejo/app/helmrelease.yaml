---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  timeout: 10m
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The chart has no extra-init-container hook, so inject the repo's standard
  # postgres-init step (creates the forgejo role + db on postgres-cluster).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: forgejo
            patch: |
              - op: add
                path: /spec/template/spec/initContainers/0
                value:
                  name: init-db
                  image: ghcr.io/home-operations/postgres-init:18
                  envFrom:
                    - secretRef:
                        name: forgejo-db
                    - secretRef:
                        name: forgejo-initdb
  values:
    image:
      rootless: true
    strategy:
      type: Recreate
    deployment:
      annotations:
        reloader.stakater.com/auto: "true"
    persistence:
      enabled: true
      create: false
      claimName: *app # created by the volsync component
    service:
      http:
        port: 3000
      ssh:
        port: 2222
    httpRoute:
      enabled: true
      port: 3000
      hostnames: ["git.${SECRET_DOMAIN}"]
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Home
        gethomepage.dev/name: Forgejo
        gethomepage.dev/icon: forgejo.svg
        gethomepage.dev/app: *app
    gitea:
      admin:
        existingSecret: forgejo-admin
        email: admin@${SECRET_DOMAIN}
        passwordMode: initialOnlyNoReset
      # Login via Authentik (OAuth2/OpenID provider + application, slug "forgejo").
      oauth:
        - name: authentik
          provider: openidConnect
          existingSecret: forgejo-oauth
          autoDiscoverUrl: https://auth.${SECRET_DOMAIN}/application/o/forgejo/.well-known/openid-configuration
          iconUrl: https://auth.${SECRET_DOMAIN}/static/dist/assets/icons/icon.svg
          scopes: openid email profile
          groupClaimName: groups
          adminGroup: authentik Admins
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-db
              key: FORGEJO__DATABASE__PASSWD
      config:
        APP_NAME: Forgejo
        server:
          DOMAIN: git.${SECRET_DOMAIN}
          ROOT_URL: https://git.${SECRET_DOMAIN}/
          SSH_DOMAIN: git-ssh.${SECRET_DOMAIN}
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
        database:
          DB_TYPE: postgres
          HOST: postgres-cluster-rw.database.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
          SSL_MODE: disable
        service:
          # Accounts are created only through Authentik sign-in; no local sign-up.
          DISABLE_REGISTRATION: false
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          USERNAME: nickname # Authentik's profile scope sends nickname = username
          ACCOUNT_LINKING: auto
          UPDATE_AVATAR: true
        openid:
          ENABLE_OPENID_SIGNIN: false
          ENABLE_OPENID_SIGNUP: false
        repository:
          DEFAULT_BRANCH: main
        mirror:
          ENABLED: true
          DEFAULT_INTERVAL: 8h
        cache:
          ADAPTER: memory
        session:
          PROVIDER: db
        queue:
          TYPE: level
        cron.update_mirrors:
          SCHEDULE: "@every 8h"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
