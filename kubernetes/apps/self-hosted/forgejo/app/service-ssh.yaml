---
# Git-over-SSH on its own LAN IP. Port 22 → rootless Forgejo's built-in SSH (2222).
# CLUSTER_LB_FORGEJO comes from cluster_secrets (Bitwarden), like CLUSTER_LB_IMMICH.
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh-lb
  annotations:
    lbipam.cilium.io/ips: ${CLUSTER_LB_FORGEJO}
    external-dns.alpha.kubernetes.io/hostname: git-ssh.${SECRET_DOMAIN}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/name: forgejo
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
      protocol: TCP
