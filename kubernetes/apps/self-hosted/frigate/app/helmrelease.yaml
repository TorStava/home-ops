---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app frigate
spec:
  timeout: 15m
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/replicas]
  values:
    controllers:
      *app :
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.2
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
            # Not privileged: detection runs on the CPU and no device is passed in. s6 needs
            # these to set up its log dirs and drop to service users; media is on NFS.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
              seccompProfile:
                type: RuntimeDefault

    service:
      # In-cluster only: 8971 (authenticated UI) for the internal gateway route, 5000 for homepage.
      app:
        controller: *app
        primary: true
        # Keep the name `frigate`: the route and homepage widget point at it.
        forceRename: *app
        ports:
          http:
            port: &port 8971
          unsecure:
            port: 5000
      # LAN address for Home Assistant only: the integration's API (5000, unauthenticated by
      # design) and camera restreams (8554). Cilium drops any other source.
      ha:
        controller: *app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.1.249
        loadBalancerSourceRanges:
          - 192.168.1.20/32 # home-assistant (external-services/home-assistant)
        ports:
          unsecure:
            port: 5000
          rtsp:
            port: 8554

    route:
      app:
        hostnames:
          - '{{ .Release.Name }}.${SECRET_DOMAIN}'
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/name: Frigate
          gethomepage.dev/group: Home
          gethomepage.dev/icon: frigate.svg
          gethomepage.dev/widget.type: frigate
          gethomepage.dev/widget.url: http://frigate.self-hosted.svc.cluster.local:5000

    persistence:
      data:
        existingClaim: *app
      config-file:
        enabled: true
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yaml
      media:
        type: nfs
        server: ${NAS_IP}
        path: ${NAS_PATH}/frigate
        globalMounts:
          - path: /media
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm
