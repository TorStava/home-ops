---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Provider keys for God's Eye View, from the Bitwarden secret "gods-eye-view".
# Its value is one JSON object; every key in it becomes an env var, e.g.
#   {"GOOGLE_MAPS_API_KEY": "...", "CESIUM_ION_TOKEN": "...", "AISSTREAM_API_KEY": "..."}
# Names follow upstream's .env.example. No template block on purpose: new keys
# flow through without a git change, and reloader restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app gods-eye-view
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gods-eye-view
