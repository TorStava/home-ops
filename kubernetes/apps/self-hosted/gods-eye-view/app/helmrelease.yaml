---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gods-eye-view
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled

  values:
    controllers:
      gods-eye-view:
        replicas: 1
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true

        # Upstream's image runs the Vite dev server: ~1000 unbundled module
        # requests per page load, each through Cloudflare and the authentik
        # outpost. Instead, build the bundle at pod start and serve it with
        # `vite preview`, which registers the same /api provider routes
        # (credential editing /api/setup/* is dev-only and absent).
        # The build bakes the browser keys (GOOGLE_MAPS_API_KEY,
        # CESIUM_ION_TOKEN, MAPILLARY_CLIENT_TOKEN) into the bundle, so it must
        # not happen in CI: the GHCR image is public. Reloader restarts the pod
        # when the Secret changes, which rebuilds with the new keys (~15s).
        initContainers:
          build:
            image: &image
              # Built from upstream's Dockerfile by .github/workflows/build-gods-eye-view.yaml
              repository: ghcr.io/torstava/gods-eye-view
              tag: v0.3.0
            command: ["node", "node_modules/vite/bin/vite.js", "build", "--emptyOutDir"]
            envFrom: &envFrom
              # Optional so the app still starts before the Bitwarden secret exists
              - secretRef:
                  name: *app
                  optional: true
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 3Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # Vite writes its build cache under node_modules, the app .gev-cache under /app
              readOnlyRootFilesystem: false

        containers:
          app:
            image: *image
            command: ["node", "node_modules/vite/bin/vite.js", "preview", "--host", "0.0.0.0", "--port", "4173", "--strictPort"]
            envFrom: *envFrom
            env:
              PORT: &port 4173
              # Vite rejects unknown Host headers. The authentik outpost may send
              # either the public name or the internal service name.
              GEV_ALLOWED_HOSTS: godseye.${SECRET_DOMAIN},gods-eye-view.self-hosted.svc.cluster.local,gods-eye-view
              # The launcher would otherwise trust the pod's default gateway (the
              # Cilium router) for the in-app key setup. Keys are not set in the UI here.
              GEV_KEY_SETUP_TRUSTED_PEERS: none
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 12
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *securityContext

    service:
      app:
        ports:
          http:
            port: *port

    persistence:
      dist:
        type: emptyDir
        advancedMounts:
          gods-eye-view:
            build:
              - path: /app/dist
            app:
              - path: /app/dist
