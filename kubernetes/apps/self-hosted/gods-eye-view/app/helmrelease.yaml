---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gods-eye-view
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled

  values:
    controllers:
      gods-eye-view:
        replicas: 1
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true

        containers:
          app:
            # Built from upstream's Dockerfile by .github/workflows/build-gods-eye-view.yaml
            image:
              repository: ghcr.io/torstava/gods-eye-view
              tag: v0.3.0
            env:
              PORT: &port 4173
              # Vite rejects unknown Host headers. The authentik outpost may send
              # either the public name or the internal service name.
              GEV_ALLOWED_HOSTS: godseye.${SECRET_DOMAIN},gods-eye-view.self-hosted.svc.cluster.local,gods-eye-view
              # The launcher would otherwise trust the pod's default gateway (the
              # Cilium router) for the in-app key setup. Keys are not set in the UI here.
              GEV_KEY_SETUP_TRUSTED_PEERS: none
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # The dev server writes .gev-cache, .gev-logs and Vite's dep cache under /app
              readOnlyRootFilesystem: false

    service:
      app:
        ports:
          http:
            port: *port
