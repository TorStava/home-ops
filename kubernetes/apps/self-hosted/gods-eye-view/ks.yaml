---
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gods-eye-view
  namespace: &namespace self-hosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/external
  dependsOn:
    - name: authentik
      namespace: security
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/self-hosted/gods-eye-view/app
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: godseye
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
