---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app joplin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: joplin-initdb
        containers:
          app:
            image:
              repository: joplin/server
              tag: 3.7.1@sha256:b9666df06e7e2db20aeb961d2aca19e20664b985ead96995ecd32f9d720f002c
            env:
              APP_PORT: &port 22300
              APP_BASE_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              DB_CLIENT: pg
              POSTGRES_HOST: postgres-cluster-rw.database.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DATABASE: *app
              POSTGRES_USER: *app
            envFrom:
              - secretRef:
                  name: *app
            probes:
              # Joplin server 404s any request whose Host header doesn't match
              # APP_BASE_URL's host (see isValidOrigin() in routeUtils.ts) — the
              # kubelet probe hits the pod IP directly, so it needs a Host override.
              liveness: &joplinProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: joplin.${SECRET_DOMAIN}
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *joplinProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: joplin.${SECRET_DOMAIN}
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # joplin/server image bakes in a "joplin" user at uid/gid 1001 and chowns
        # /opt/pm2 (PM2_HOME) to it; any other uid gets EACCES writing pm2.log.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Joplin
          gethomepage.dev/icon: joplin.png
          gethomepage.dev/app: *app
