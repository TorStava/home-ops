---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  timeout: 15m
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/replicas]
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: outline-initdb
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.34.6@sha256:f5140088385af2d4e681e177d8264bcb41e8fe126062030c5c65cd8f3e1605e1
            command:
              - /bin/sh
            args:
              - -c
              - sleep 5; exec n8n
            env: &env
              GENERIC_TIMEZONE: ${TIMEZONE}
              EXECUTIONS_DATA_PRUNE: true
              EXECUTIONS_DATA_MAX_AGE: 7
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
              N8N_WEBHOOK_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}/
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_PROTOCOL: "https"
              N8N_PORT: &port 8080
              N8N_HOST: n8n.${SECRET_DOMAIN}
              N8N_PROXY_HOPS: 1
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console
              N8N_RUNNERS_TASK_TIMEOUT: 300
              N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 2147483648
              N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 5000
              # n8n 2.0 disables ExecuteCommand + LocalFileTrigger by default
              # (arbitrary shell exec / arbitrary local file triggers). Re-enable
              # only ExecuteCommand — needed by the reddit-monitor workflow to
              # shell out to wget, since Reddit's anti-bot system fingerprints
              # and blocks Node's own HTTP client at the TLS layer. Keep
              # LocalFileTrigger disabled.
              NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
              # Read/Write Files From Disk has TWO independent restrictions
              # that both block writes inside n8nFolder (/home/node/.n8n) by
              # default: N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES (blocks n8nFolder
              # outright) and N8N_RESTRICT_FILE_ACCESS_TO (an allowlist that
              # defaults to ~/.n8n-files only). First attempt at this fix set
              # the env var without the N8N_ prefix (wrong name, silently had
              # no effect — confirmed live via a real execution still hitting
              # "Access to the file is not allowed" after that "fix" was
              # deployed) and missed the allowlist restriction entirely.
              # The reddit-monitor workflow's dedupe cache lives in
              # /home/node/.n8n (the only persistent volume mounted), written
              # via this node instead of a shell heredoc after the heredoc
              # approach hit a Linux argv-size limit ("spawn E2BIG") once the
              # cache grew past ~130KB. Not a meaningful capability increase:
              # ExecuteCommand (arbitrary shell) is already enabled above and
              # already writes to this same path unrestricted, so this just
              # makes the purpose-built node consistent with what shell
              # access already permits.
              N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'false'
              N8N_RESTRICT_FILE_ACCESS_TO: '~/.n8n-files;/home/node/.n8n'
              DB_TYPE: postgresdb
              DB_POSTGRESDB_DATABASE: *app
              DB_POSTGRESDB_HOST: postgres-cluster-rw.database.svc.cluster.local
              DB_POSTGRESDB_PORT: 5432
              DB_POSTGRESDB_USER: *app
            envFrom: &envFrom
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 500m
                memory: 256Mi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Home
          gethomepage.dev/name: n8n
          gethomepage.dev/icon: n8n.png
          gethomepage.dev/app: *app

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          *app :
            app:
              - path: /home/node/.n8n
