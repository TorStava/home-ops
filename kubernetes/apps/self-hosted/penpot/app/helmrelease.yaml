---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app "${APP}"
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/replicas]
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom:
              - secretRef:
                  name: *app
              - secretRef:
                  name: penpot-initdb
        containers:
          frontend:
            dependsOn:
              - backend
              - exporter
            image:
              repository: penpotapp/frontend
              tag: 2.19.5@sha256:5b7ad570f137162b0c4cae300e42a376c15e05cb6ec89404f67e43a0996d0107
            env:
              PENPOT_PUBLIC_URI: https://penpot.${SECRET_DOMAIN}
              PENPOT_BACKEND_URI: http://penpot-backend.self-hosted.svc.cluster.local:6060
              PENPOT_EXPORTER_URI: http://penpot-exporter.self-hosted.svc.cluster.local:6061
            envFrom:
              - secretRef:
                  name: *app
          backend:
            image:
              repository: penpotapp/backend
              tag: 2.19.3@sha256:31ebb4dabd104c2ed3ae736dcf5a6043a0660ddaac7bcd8501c28036fb4b578c
            env:
              PENPOT_PUBLIC_URI: https://penpot.${SECRET_DOMAIN}
              # Since 2.19.3 the backend refuses outgoing requests to private
              # addresses, and Authentik resolves to one inside the cluster, which
              # silently turned OIDC login off.
              PENPOT_SSRF_ALLOWED_HOSTS: auth.${SECRET_DOMAIN}
              PENPOT_DATABASE_URI: postgresql://postgres-cluster-rw.database.svc.cluster.local/{{ .PENPOT_POSTGRES_DBNAME }}
              PENPOT_REDIS_URI: redis://dragonfly-cluster.database.svc.cluster.local:6379
              PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
              PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
              PENPOT_TELEMETRY_ENABLED: false
            envFrom:
              - secretRef:
                  name: *app
          exporter:
            image:
              repository: penpotapp/exporter
              tag: 2.19.3@sha256:1705d70e79f3530b3cee65d0cdbee3c5f44f26d62f5ad43bac7945dce4c7b653
            env:
              PENPOT_PUBLIC_URI: https://penpot.${SECRET_DOMAIN}
              PENPOT_REDIS_URI: redis://dragonfly-cluster.database.svc.cluster.local:6379
            envFrom:
              - secretRef:
                  name: *app
    service:
      frontend:
        primary: true
        forceRename: *app
        ports:
          http:
            primary: true
            port: &port 8080
      backend:
        ports:
          http:
            port: 6060
      exporter:
        ports:
          http:
            port: 6061
      prepl:
        ports:
          http:
            port: 6062

    route:
      app:
        hostnames: ["penpot.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Penpot
          gethomepage.dev/group: Design
          gethomepage.dev/icon: penpot.png
          gethomepage.dev/app: penpot
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      assets:
        enabled: true
        existingClaim: *app
        advancedMounts:
          *app :
            frontend:
              - path: /opt/data/assets
            backend:
              - path: /opt/data/assets

