---
# The API's own config (slektly ADR 0022): who may sign in as an owner.
# The Bitwarden item slektly holds OWNER_EMAILS (comma-separated). The API reads it at startup;
# reloader restarts the pod when the secret changes, but not when it is first created (reloader runs
# without --reload-on-create): after the item first appears, `kubectl -n self-hosted rollout restart
# deploy/slektly`. DATABASE_URL comes from CNPG's postgres-slektly-app secret.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret slektly-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OWNER_EMAILS: "{{ .OWNER_EMAILS }}"
  dataFrom:
    - extract:
        key: slektly
