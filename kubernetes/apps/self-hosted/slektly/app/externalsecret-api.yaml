---
# The API's own config. The Bitwarden item slektly holds OWNER_EMAILS (who may sign in as an owner,
# ADR 0022), ADMIN_EMAILS (who manages the suppression list and reads every rights request; must also be
# an owner to get a sign-in link, ADR 0030) and MATCH_KEY_SECRET (the HMAC key for rights-request match
# keys, at least 32 characters; changing it means every tree is rebuilt, ADR 0030). The API reads them
# at startup and refuses to start without MATCH_KEY_SECRET; reloader restarts the pod when the secret
# changes. If the secret lacks a key after a Bitwarden change:
# `kubectl -n self-hosted annotate externalsecret slektly-api force-sync=$(date +%s) --overwrite`.
# DATABASE_URL comes from CNPG's postgres-slektly-app secret.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret slektly-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OWNER_EMAILS: "{{ .OWNER_EMAILS }}"
        ADMIN_EMAILS: "{{ .ADMIN_EMAILS }}"
        MATCH_KEY_SECRET: "{{ .MATCH_KEY_SECRET }}"
  dataFrom:
    - extract:
        key: slektly
