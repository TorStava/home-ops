---
# The contact API's mail settings: Scaleway Transactional Email (slektly ADR 0019, #154).
# The Bitwarden item scaleway-tem-slektly holds PROJECT_ID, SECRET_KEY, CONTACT_TO and MAIL_FROM
# (ACCESS_KEY_ID is also in it; sending does not use it, so it is not mapped).
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret slektly-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SCW_PROJECT_ID: "{{ .PROJECT_ID }}"
        SCW_SECRET_KEY: "{{ .SECRET_KEY }}"
        CONTACT_TO: "{{ .CONTACT_TO }}"
        MAIL_FROM: "{{ .MAIL_FROM }}"
  dataFrom:
    - extract:
        key: scaleway-tem-slektly
