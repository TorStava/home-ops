---
# The image is private (TorStava/slektly): pull it with a read:packages token.
# Reuses the token in the afterword item (same account, read:packages); no new secret.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret slektly-ghcr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "TorStava:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: afterword
