---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app slektly
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/torstava/slektly
              tag: sha-5fd4b35@sha256:3983216282d6bab768acbc2a21bef4f689eba49dcbdce48298e09a03cb5c4f1c
            # No GEDCOM_PATH and nothing mounted: /__slektly/startup.ged answers 204 (slektly#67, decision 5).
            env:
              # Believe Cloudflare's CF-Connecting-IP for the rate limit: every request comes through
              # the tunnel. Set on both containers (slektly ADR 0019), else all visitors share one bucket.
              TRUST_CF_CONNECTING_IP: "1"
            # /api/ goes to the api container on 127.0.0.1:8787 (the default SLEKTLY_API_UPSTREAM).
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 2
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # The contact form's API (slektly ADR 0019): listens on 127.0.0.1:8787, shared with nginx.
          api:
            image:
              repository: ghcr.io/torstava/slektly-api
              tag: sha-5fd4b35@sha256:9cb61be06884609bcd4798b4f70b62d8c433a6cef429c5c933a2655e6d724293
            env:
              # Scaleway Transactional Email (slektly#154); Personvern names it since slektly#171.
              # The secret below carries the key; set fake to stop delivery without stopping the form.
              MAIL_PROVIDER: scaleway
              TRUST_CF_CONNECTING_IP: "1"
            envFrom:
              - secretRef:
                  name: slektly-mail
            # Loopback only, so the kubelet cannot probe it over the network: an exec probe from inside.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - -e
                      - fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      imagePullSecrets:
        - name: slektly-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged
        runAsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /tmp
      # The entrypoint renders the nginx template into conf.d at start.
      nginx-conf:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /etc/nginx/conf.d
    # Public, on the second zone's own listener. www and the .com names redirect at Cloudflare.
    route:
      app:
        hostnames: ["${SECRET_DOMAIN_SLEKTLY}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https-slektly
