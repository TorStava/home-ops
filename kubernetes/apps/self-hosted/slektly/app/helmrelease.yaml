---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app slektly
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/torstava/slektly
              tag: sha-3945752@sha256:e145e257bdb98d4481bde37ff9b0591096bf7ee086e831e8340b2f424243f18a
            # No GEDCOM_PATH and nothing mounted: /__slektly/startup.ged answers 204 (slektly#67, decision 5).
            env:
              # Believe Cloudflare's CF-Connecting-IP for the rate limit: every request comes through
              # the tunnel. Set on both containers (slektly ADR 0019), else all visitors share one bucket.
              TRUST_CF_CONNECTING_IP: "1"
            # /api/ goes to the api container on 127.0.0.1:8787 (the default SLEKTLY_API_UPSTREAM).
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 2
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          # The contact form's API (slektly ADR 0019): listens on 127.0.0.1:8787, shared with nginx.
          api:
            image:
              repository: ghcr.io/torstava/slektly-api
              tag: sha-3945752@sha256:6aa5c2d246a2ef8cc1c0dcf88ea0e33daded35dc893dcc2040d26fb318d8ab09
            env:
              # Scaleway Transactional Email (slektly#154); Personvern names it since slektly#171.
              # The secret below carries the key; set fake to stop delivery without stopping the form.
              MAIL_PROVIDER: scaleway
              TRUST_CF_CONNECTING_IP: "1"
              # Sign-in by e-mail link (slektly ADR 0022). https, so the session cookie is
              # __Host- and Secure; never set ALLOW_INSECURE_SITE here.
              SITE_ORIGIN: "https://${SECRET_DOMAIN_SLEKTLY}"
              # The API migrates this database itself at startup; CNPG makes slektly its owner.
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-slektly-app
                    key: uri
            envFrom:
              - secretRef:
                  name: slektly-mail
              # OWNER_EMAILS, ADMIN_EMAILS and MATCH_KEY_SECRET (slektly ADR 0022, 0030). Required:
              # since slektly#182 the API refuses to start in production without MATCH_KEY_SECRET.
              - secretRef:
                  name: slektly-api
            # Loopback only, so the kubelet cannot probe it over the network: an exec probe from inside.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - -e
                      - fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: false
              startup:
                enabled: false
            # Sized for tree builds (uploads and the hourly rebuild run in a worker thread with a
            # 3072 MB heap cap, slektly server/tree-builder.ts), not the contact form. Measured on
            # sha-478bff6's code, peak RSS of the whole process: 3.4 MB GEDCOM (fixtures/large.ged)
            # 529 MiB; 53.5 MiB, 50,000 people about 4.5 GiB; 63.3 MiB, 59,000 people (at the 64 MiB
            # upload cap) 4864-4882 MiB, once 5226 MiB. 6Gi leaves about 15% over the worst run.
            # Kept at 6Gi since sha-1ec194b: slektly#190 measured 4.9 GiB at the cap, but an upload now
            # also reconciles suggestions against the earlier view in the worker (slektly#180), which
            # has not been measured at the cap yet.
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      imagePullSecrets:
        - name: slektly-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged
        runAsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /tmp
      # The entrypoint renders the nginx template into conf.d at start.
      nginx-conf:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /etc/nginx/conf.d
    # Public, on the second zone's own listener. www and the .com names redirect at Cloudflare.
    route:
      app:
        hostnames: ["${SECRET_DOMAIN_SLEKTLY}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https-slektly
