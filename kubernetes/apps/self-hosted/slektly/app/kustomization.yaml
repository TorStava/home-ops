---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./externalsecret-mail.yaml
  - ./helmrelease.yaml
# The shared gatus/external component builds its URL on ${SECRET_DOMAIN}, so this app carries its own.
configMapGenerator:
  - name: slektly-gatus-external-ep
    files:
      - config.yaml=./gatus.yaml
    options:
      labels:
        gatus.io/enabled: "true"
generatorOptions:
  disableNameSuffixHash: true
