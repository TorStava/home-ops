---
# Database passwords, generated once in-cluster (no Bitwarden item). Each ExternalSecret below calls the
# generator on its own, so each gets its own password. Letters and digits only, so they are safe in a URL
# or a JDBC setting as they are. If a secret is ever deleted it comes back with a new password, and both
# users follow it: CNPG re-applies the keycloak password, and Turvis's migration runner sets turvis_app's
# on every start.
# yaml-language-server: $schema=https://schemas.tholinka.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-db-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# turvis_app, the role the web app and the scheduler log in as (subject to row-level security). Its
# password key is the app's APP_DB_PASSWORD. Not a CNPG role: the migration runner creates it.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-app-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        username: turvis_app
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-db-password
---
# keycloak, the owner of the keycloak database. CNPG reads it (DatabaseRole in keycloak.yaml), so it is
# basic-auth with the reload label.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-keycloak-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: 'true'
      data:
        username: keycloak
        password: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-db-password
