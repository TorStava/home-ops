---
# Turvis's Garage secrets, generated once in-cluster (no Bitwarden item), the pattern of ../db/externalsecret.yaml.
# The generator makes letters and digits; Garage wants hex (RPC secret: 64 hex digits; key: "GK" + 24 hex digits and a
# 64 hex digit secret), and the Password generator cannot make hex. So each ExternalSecret below calls the generator
# once (64 characters, about 380 bits) and the template turns that into hex with sha256sum (a hash of the seed and a
# label, so the values of one secret do not equal each other). Hex of the first 24 digits only for the key id, which
# is not a secret. If a secret is ever deleted it comes back with new values (see the notes on each one).
# yaml-language-server: $schema=https://schemas.tholinka.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-garage-seed
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# What Garage itself needs: the RPC secret and the admin token. Only the turvis-garage pod mounts it (the admin API is
# on its loopback, and so is RPC). A new value after a deleted secret is harmless: the RPC secret only has to match
# the nodes of one cluster (there is one), and the admin token is only checked on a request.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-garage
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GARAGE_RPC_SECRET: '{{ printf "%s:rpc" .password | sha256sum }}'
        GARAGE_ADMIN_TOKEN: '{{ printf "%s:admin" .password | sha256sum }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-garage-seed
---
# What the app (the web app and the scheduler, step 6) mounts, and the setup container of the Garage pod reads to
# make the bucket and import the key. Keys are the app's S3_* settings (turvis .env.example), so a pod can use it with
# envFrom: S3_ENDPOINT (path-style, plain http inside the cluster), S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY and S3_FORCE_PATH_STYLE. The key can read, list, write and delete in the bucket and do
# nothing else; the admin token is not here.
# Garage cannot change a key's secret, so if this secret is deleted and made again, setup stops with a message and the
# pod stays unready (demo data only: delete the volume claim turvis-garage too, and Flux makes both again).
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-s3
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        S3_ENDPOINT: http://${APP}-garage.self-hosted.svc.cluster.local:3900
        S3_REGION: garage
        S3_BUCKET: turvis-photos
        S3_ACCESS_KEY_ID: '{{ printf "GK%s" (printf "%s:key-id" .password | sha256sum | trunc 24) }}'
        S3_SECRET_ACCESS_KEY: '{{ printf "%s:key-secret" .password | sha256sum }}'
        S3_FORCE_PATH_STYLE: "1"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-garage-seed
