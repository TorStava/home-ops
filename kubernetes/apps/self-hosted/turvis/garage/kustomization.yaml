---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./networkpolicy.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: turvis-garage-config
    files:
      - garage.toml=./garage.toml
  - name: turvis-garage-setup
    files:
      - setup.sh=./setup.sh
generatorOptions:
  disableNameSuffixHash: true
