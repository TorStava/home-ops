---
# Keycloak's two passwords, generated once in-cluster (no Bitwarden item), the same pattern as the
# database passwords in ../db/externalsecret.yaml. Each ExternalSecret calls the generator on its
# own, so each gets its own value. Letters and digits only.
# yaml-language-server: $schema=https://schemas.tholinka.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${APP}-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# The bootstrap admin of the master realm. Keycloak makes it only while master has no admin, and
# marks it temporary: sign in on the internal admin host, make a permanent admin, delete this one.
# Read it with: kubectl -n self-hosted get secret turvis-keycloak-admin -o jsonpath='{.data.KC_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-admin
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# The turvis-web client's secret: Keycloak reads it once, when it imports the realm
# (TURVIS_WEB_CLIENT_SECRET), and the web app (step 6) reads the same keys as OIDC_CLIENT_ID and
# OIDC_CLIENT_SECRET. If this secret is ever deleted it comes back with a new value that the realm
# does not have: then set it on the client in the admin console (Credentials) or delete the realm.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret turvis-web-oidc
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        client-id: turvis-web
        client-secret: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# The turvis-admin client's secret (turvis ADR 0004, #24): the service account the web app uses to
# make login accounts (realm-management manage-users only). Generated in the cluster, never in git.
# Keycloak gets it as TURVIS_ADMIN_CLIENT_SECRET, and its entrypoint sets it on the client at every
# start when it does not work (an existing realm, or a new value after this secret is deleted), so
# unlike turvis-web-oidc a lost secret needs no admin console. The web app reads the same keys as
# OIDC_ADMIN_CLIENT_ID and OIDC_ADMIN_CLIENT_SECRET.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret turvis-admin-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        client-id: turvis-admin
        client-secret: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# The turvis-platform client's secret (turvis #235): the service account the scheduler uses to make each company's Keycloak
# organization (realm-management manage-realm). Generated in the cluster, never in git. Keycloak gets it as
# TURVIS_PLATFORM_CLIENT_SECRET, and its entrypoint makes the client (a fresh import has none) and sets this secret on it
# at every start when it does not work, as for turvis-admin. Only the scheduler reads it (OIDC_PLATFORM_CLIENT_SECRET),
# never the web app.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret turvis-platform-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *secret
    creationPolicy: Owner
    template:
      data:
        client-id: turvis-platform
        client-secret: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${APP}-password
---
# The Turvis images are private (TorStava/turvis): pull them with a read:packages token. Reuses the
# token in the afterword item (same account, read:packages), as slektly-ghcr does; no new secret.
# The web app and the scheduler (step 6) can use this pull secret too.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret turvis-ghcr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "TorStava:%s" .GHCR_PULL_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: afterword
