---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app turvis-keycloak
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      *app :
        # One pod at a time: the entrypoint may run Keycloak's `bootstrap-admin` (adding turvis-admin to
        # an existing realm), which needs every Keycloak node stopped. Also one set of local caches.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Keycloak with the Turvis login theme and the realm built in (turvis infra/keycloak/Dockerfile):
            # an optimized build for Postgres, health and metrics on the management port.
            image:
              repository: ghcr.io/torstava/turvis-keycloak
              tag: sha-f14b4a7@sha256:4a8a2a94dfc00bf5c1887ca0fe1ab75c318bbea00f9411350a51d87dc64902f8
            # Production mode. --import-realm imports turvis only when it does not exist yet, so the
            # users and settings made in the admin console stay across restarts and new images.
            args: ["start", "--optimized", "--import-realm"]
            env:
              KC_DB_URL: jdbc:postgresql://postgres-turvis-rw.self-hosted.svc.cluster.local:5432/keycloak
              KC_DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: turvis-keycloak-db
                    key: username
              KC_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: turvis-keycloak-db
                    key: password
              # Login pages, tokens and the issuer: https://auth.<turvis domain>/realms/turvis.
              KC_HOSTNAME: https://auth.${SECRET_DOMAIN_TURVIS}
              # The admin console on an internal host only: the public route below passes only the
              # turvis realm and static resources. This moves only the console's own URLs; its login
              # goes to the master realm on the master realm's frontend URL, which is KC_HOSTNAME
              # (404 publicly) until master's frontendUrl is set to this host once, by hand, after
              # the first start (the PR's after-merge step; the master realm cannot be imported).
              KC_HOSTNAME_ADMIN: https://turvis-keycloak.${SECRET_DOMAIN}
              # TLS ends at the gateway; Keycloak gets plain http with X-Forwarded-* from Envoy.
              KC_HTTP_ENABLED: "true"
              KC_PROXY_HEADERS: xforwarded
              # One replica, so local caches: with the default ispn (JGroups jdbc-ping) a start after an
              # unclean stop waits about 20 s on cluster JOIN (measured: ready in 29 s, 7 s with local).
              KC_CACHE: local
              # The realm import's two values (turvis infra/keycloak/realm-cluster.jq): the only app
              # address the turvis-web client accepts, and its secret. The image refuses to import
              # the realm without them.
              TURVIS_APP_URL: https://app.${SECRET_DOMAIN_TURVIS}
              TURVIS_WEB_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: turvis-web-oidc
                    key: client-secret
              # turvis-admin (turvis ADR 0004): in the realm file for a fresh import, and set on the
              # existing realm by the entrypoint when it does not work yet. The image refuses to start
              # without it.
              TURVIS_ADMIN_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: turvis-admin-client
                    key: client-secret
              # The realm's mail (password reset, email verification): Scaleway TEM from Secret
              # turvis-mail (step 5), implicit TLS on 465. These fill the realm at import; the password
              # is not here but in the vault mount below, read by Keycloak at every send. The image
              # refuses to import the realm without them.
              TURVIS_SMTP_HOST:
                valueFrom:
                  secretKeyRef:
                    name: turvis-mail
                    key: SMTP_HOST
              TURVIS_SMTP_PORT:
                valueFrom:
                  secretKeyRef:
                    name: turvis-mail
                    key: SMTP_PORT
              TURVIS_SMTP_USER:
                valueFrom:
                  secretKeyRef:
                    name: turvis-mail
                    key: SMTP_USER
              TURVIS_SMTP_FROM:
                valueFrom:
                  secretKeyRef:
                    name: turvis-mail
                    key: SMTP_FROM
            envFrom:
              - secretRef:
                  name: turvis-keycloak-admin
            probes:
              # When the entrypoint adds turvis-admin to the existing realm it starts the server a second time,
              # and /health/live is down meanwhile (about 15 s on an idle node, over 90 s at half a CPU, measured
              # in the review of turvis#241). Two minutes of failures before a restart, so that start is not cut
              # off (a cut one is retried at the next start, but would loop on a slow node).
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &management 9000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *management
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # First start creates the schema and imports the realm (about 30 s locally).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/started
                    port: *management
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            # The JVM heap follows the limit: Keycloak's default JAVA_OPTS_KC_HEAP is
            # -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=50 of the container's memory.
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 1536Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      # A stop while the entrypoint adds turvis-admin still deletes its temporary admin before the
      # server stops (a few kcadm calls), then the server's own shutdown: more than the default 30 s.
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: turvis-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # keycloak
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
          management:
            port: *management
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: management
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    # The root filesystem stays read-only; Keycloak writes only here (and reads the vault). transaction-logs is Narayana's
    # object store: without it every start waits about 30 s on RecoveryModule retries (measured 36.6 s
    # vs 6.6 s). Not all of /opt/keycloak/data, which would hide the realm in data/import.
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      data-tmp:
        type: emptyDir
        globalMounts:
          - path: /opt/keycloak/data/tmp
      transaction-logs:
        type: emptyDir
        globalMounts:
          - path: /opt/keycloak/data/transaction-logs
      # Keycloak's file vault (KC_VAULT_DIR in the image): the realm's SMTP password is
      # ${vault.smtp-password}, file <realm>_<key>. A whole-directory mount (no subPath), so a
      # rotated key reaches the file without a restart; it never goes into the database.
      vault:
        type: secret
        name: turvis-mail
        items:
          - key: SMTP_PASSWORD
            path: turvis_smtp-password
        globalMounts:
          - path: /opt/keycloak/data/vault
            readOnly: true
    route:
      # Public, through the tunnel: only the turvis realm (login, tokens, account) and the static
      # files its pages load. Not /admin/ and not the master realm; other paths 404 at the gateway.
      app:
        hostnames: ["auth.${SECRET_DOMAIN_TURVIS}"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https-turvis
        rules:
          - matches:
              - path: {type: PathPrefix, value: /realms/turvis/}
              - path: {type: PathPrefix, value: /resources/}
            backendRefs: [{identifier: app, port: *port}]
      # The admin console, on the LAN only (internal gateway; DNS from pihole, never Cloudflare).
      admin:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs: [{identifier: app, port: *port}]
