---
# Turvis's Keycloak (turvis ADR 0004): the login for app.<turvis domain>, public on auth.<turvis domain>,
# realm turvis imported once from the image (turvis infra/keycloak: no dev users, no dev secret). Its
# database is keycloak in the postgres-turvis cluster (../ks.yaml), so it waits for that.
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app turvis-keycloak
  namespace: &namespace self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: postgres-turvis
      namespace: *namespace
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/self-hosted/turvis/keycloak/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
