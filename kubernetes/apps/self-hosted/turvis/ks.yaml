---
# Turvis's own Postgres: one instance, backed up by barman-cloud to an R2 bucket in the EU jurisdiction
# (home-ops#842, as postgres-slektly): a base backup daily, WAL archived as it fills (at least every
# 5 minutes) for point-in-time recovery, 30 days kept. The backup holds both databases, turvis and
# keycloak. The shared postgres bucket is not EU, so this cluster overrides the bucket, the endpoint and
# the R2 credentials of the cnpg/backup component:
#   - bucket: turvis-postgres (EU jurisdiction), set below
#   - endpoint: CLOUDFLARE_S3_ENDPOINT_EU in the Bitwarden item cluster_secrets
#     (https://<account id>.eu.r2.cloudflarestorage.com)
#   - credentials: TURVIS_R2_ACCESS_KEY_ID / TURVIS_R2_SECRET_ACCESS_KEY in the Bitwarden item
#     turvis-r2 (an R2 token with Object Read & Write on that bucket only)
# If archiving fails (a wrong token, R2 down), Postgres keeps every WAL file on its 2Gi volume until it
# works again: the ContinuousArchiving condition on the Cluster says so.
# Later Kustomizations (Keycloak, the web app and the scheduler) dependsOn this one.
#
# Database turvis, owned by role turvis (CNPG's secret postgres-turvis-app: username, password, host,
# dbname, uri). The owner runs Turvis's migrations, and the migration runner itself creates the app's
# login role turvis_app and sets its password from APP_DB_PASSWORD (secret turvis-app-db) on every run.
# So the owner gets CREATEROLE once, at bootstrap, and is deliberately not a CNPG managed role: CNPG
# revokes every membership a managed role has that is not in its inRoles, and that would take away the
# ADMIN grant on turvis_app that Postgres gives the owner when it creates the role (without it the
# runner's ALTER ROLE turvis_app ... PASSWORD fails). turvis_app is not managed by CNPG either.
#
# Database keycloak, owned by role keycloak (password in secret turvis-keycloak-db): ./db/keycloak.yaml.
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres-turvis
  namespace: &namespace self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/self-hosted/turvis/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  dependsOn:
    - name: cnpg-crds
      namespace: database
    - name: openebs
      namespace: openebs-system
  postBuild:
    substitute:
      APP: turvis
      # Overrides the shared bucket from cluster-secrets (inline substitutes win over substituteFrom).
      S3_POSTGRES_BUCKET: turvis-postgres
      CNPG_REPLICAS: '1'
      # Postgres 18: the major Turvis's compose.yaml and CI test on.
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      CNPG_VERSION: 18.7-standard-bookworm@sha256:4eae19c85f20f9ad1457b25f0dfeabef8673e67a96a6fa37ef91e6af343d6631
      CNPG_SIZE: 2Gi
      CNPG_REQUESTS_CPU: 100m
      # Turvis rows are small (photos live in S3, not here) and Keycloak's database is small too. The
      # request stays small; the component otherwise sets request = limit.
      CNPG_REQUESTS_MEMORY: 256Mi
      CNPG_LIMITS_MEMORY: 1Gi
      CNPG_LIMITS_MEMORY_HUGEPAGES: 256Mi
      CNPG_SHARED_BUFFERS: 128MB
      # Room for Keycloak's pool next to the app, the scheduler and a migration run. Inner quotes on
      # purpose: CNPG wants parameters as strings and rejects a bare number.
      CNPG_MAX_CONNECTIONS: '"150"'
  components:
    - ../../../../components/cnpg/backup
  patches:
    - target:
        kind: Cluster
      patch: |-
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: not-used
        spec:
          bootstrap:
            initdb:
              database: turvis
              owner: turvis
              dataChecksums: true
              # CNPG defaults to C, where lower() and ILIKE fold only ASCII ('ÅSE' stays 'Åse'), which breaks
              # Turvis's search and login_user's lower(email). Turvis dev and CI run en_US.utf8. Fixed at
              # initdb; the keycloak database inherits it.
              localeCollate: en_US.utf8
              localeCType: en_US.utf8
              # Runs once, as the superuser, when the cluster is created. Only CREATEROLE: the owner stays
              # NOSUPERUSER and NOBYPASSRLS, and Postgres (16+) lets a CREATEROLE role give no attribute it
              # lacks itself, so turvis_app can never get BYPASSRLS through it.
              postInitApplicationSQL:
                - ALTER ROLE turvis CREATEROLE
    # To restore this cluster from its backup: switch the component above to
    # ../../../../components/cnpg/restore and replace the initdb patch with this one. database and
    # owner are required: without them CNPG names both "app" and postgres-turvis-app points at a new,
    # empty database. Roles (turvis with CREATEROLE, turvis_app, keycloak) and the keycloak database come
    # back with the data. Optional: recoveryTarget.targetTime for a point in time.
    # - target:
    #     kind: Cluster
    #   patch: |-
    #     apiVersion: postgresql.cnpg.io/v1
    #     kind: Cluster
    #     metadata:
    #       name: not-used
    #     spec:
    #       bootstrap:
    #         recovery:
    #           database: turvis
    #           owner: turvis
    - target:
        kind: ObjectStore
      patch: |-
        apiVersion: barmancloud.cnpg.io/v1
        kind: ObjectStore
        metadata:
          name: not-used
        spec:
          configuration:
            endpointURL: ${CLOUDFLARE_S3_ENDPOINT_EU}
    # The component's ExternalSecret (turvis-cnpg): Turvis's own R2 token instead of the shared one.
    # Selected by name, not kind alone: ./db has two more ExternalSecrets (turvis-app-db,
    # turvis-keycloak-db) that this must not touch. A regex, because at patch time the name is still
    # the unsubstituted APP-cnpg.
    - target:
        kind: ExternalSecret
        name: .*-cnpg
      patch: |-
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: not-used
        spec:
          target:
            template:
              data:
                CLOUDFLARE_R2_ACCESS_KEY_ID: '{{ .TURVIS_R2_ACCESS_KEY_ID }}'
                CLOUDFLARE_R2_SECRET_ACCESS_KEY: '{{ .TURVIS_R2_SECRET_ACCESS_KEY }}'
          dataFrom:
            - extract:
                key: cloudnative_pg
            - extract:
                key: cloudflare
            - extract:
                key: turvis-r2
  healthChecks:
    - apiVersion: &postgresVersion postgresql.cnpg.io/v1
      kind: &postgresKind Cluster
      name: *app
      namespace: *namespace
    - apiVersion: *postgresVersion
      kind: &databaseKind Database
      name: postgres-turvis-keycloak
      namespace: *namespace
  healthCheckExprs:
    - apiVersion: *postgresVersion
      kind: *postgresKind
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      inProgress: status.conditions.exists(c, c.type == 'Ready' && c.status == 'False') && !status.phase.contains('manual intervention')
      failed: status.phase.contains('manual intervention')
    # Applied only once the keycloak role exists, so this also covers the DatabaseRole. No failed
    # expression: applied is false while the role is still being created.
    - apiVersion: *postgresVersion
      kind: *databaseKind
      current: has(status.applied) && status.applied == true
---
# Turvis's Keycloak (turvis ADR 0004): the login for app.<turvis domain>, public on auth.<turvis domain>,
# realm turvis imported once from the image (turvis infra/keycloak: no dev users, no dev secret). Its
# database is keycloak in the postgres-turvis cluster (above), so it waits for that; and its mail comes
# from Secret turvis-mail (ks-storage-mail.yaml), so it waits for that too.
# One manual step lives in that database: the master realm's frontendUrl = the internal admin host,
# without which nobody can sign in to the admin console. It is in postgres-turvis's backups with the
# users; only if the database is rebuilt from nothing, redo it (kcadm command in home-ops#831's
# after-merge list).
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app turvis-keycloak
  namespace: &namespace self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: postgres-turvis
      namespace: *namespace
    - name: turvis-mail
      namespace: *namespace
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/self-hosted/turvis/keycloak
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
---
# Turvis itself (step 6): the web app on app.<turvis domain> and the scheduler (turvis ADR 0011), one
# HelmRelease named turvis with two controllers, so both pods carry app.kubernetes.io/instance=turvis,
# which the Garage NetworkPolicy lets in. The web pod migrates the database at every start (turvis
# apps/web/docker/start.ts) as the owner turvis, and that run creates the app role turvis_app; both
# pods then log in as turvis_app. The scheduler's pod waits for the web app first (see its
# initContainer). Mail goes out through turvis-mail, bilder go to turvis-garage.
# yaml-language-server: $schema=https://schemas.tholinka.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app turvis
  namespace: &namespace self-hosted
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: postgres-turvis
      namespace: *namespace
    - name: turvis-keycloak
      namespace: *namespace
    - name: turvis-garage
      namespace: *namespace
    - name: turvis-mail
      namespace: *namespace
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/self-hosted/turvis/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 10m
