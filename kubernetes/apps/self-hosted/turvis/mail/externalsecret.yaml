---
# Turvis's outgoing mail through Scaleway Transactional Email (TEM) over SMTP, from the verified turvis domain, the
# way Afterword sends (../../afterword/app/externalsecret.yaml). The Bitwarden item scaleway-tem-turvis holds
# PROJECT_ID and SECRET_KEY of an API key whose IAM policy allows sending email; the SMTP login is the Project ID and
# the password the secret key. The secret turvis-mail has two groups of keys:
#   - the web app and the scheduler (step 6): SMTP_URL (nodemailer's URL, user and password percent-encoded) and
#     EMAIL_FROM, with envFrom or the two keys by name;
#   - Keycloak's realm SMTP settings (turvis-keycloak, step 4): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD and
#     SMTP_FROM (the bare address; the display name is "Turvis"). TEM's port 465 is implicit TLS ("SSL" in Keycloak,
#     not StartTLS).
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret turvis-mail
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SMTP_URL: 'smtps://{{ .PROJECT_ID | urlquery }}:{{ .SECRET_KEY | urlquery }}@smtp.tem.scaleway.com:465'
        EMAIL_FROM: "Turvis <noreply@${SECRET_DOMAIN_TURVIS}>"
        SMTP_HOST: smtp.tem.scaleway.com
        SMTP_PORT: "465"
        SMTP_USER: "{{ .PROJECT_ID }}"
        SMTP_PASSWORD: "{{ .SECRET_KEY }}"
        SMTP_FROM: "noreply@${SECRET_DOMAIN_TURVIS}"
  dataFrom:
    - extract:
        key: scaleway-tem-turvis
