---
# The R2 side of the nightly copy: Turvis's own R2 token (Object Read & Write on bucket turvis-photos-backup only,
# EU jurisdiction), from the Bitwarden item turvis-photos-r2, as rclone's settings for a remote named r2. The item's
# fields have the same names as turvis-r2's (TURVIS_R2_ACCESS_KEY_ID / TURVIS_R2_SECRET_ACCESS_KEY); it is another token.
# Only this item is extracted here, so the names cannot clash with turvis-r2's. The endpoint is
# CLOUDFLARE_S3_ENDPOINT_EU from cluster-secrets (https://<account id>.eu.r2.cloudflarestorage.com): an EU bucket
# answers only there. no_check_bucket: the token may not list or make buckets, and the bucket is Tor's.
# yaml-language-server: $schema=https://schemas.tholinka.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret ${APP}-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: *secret
    template:
      data:
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ENDPOINT: ${CLOUDFLARE_S3_ENDPOINT_EU}
        RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: '{{ .TURVIS_R2_ACCESS_KEY_ID }}'
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: '{{ .TURVIS_R2_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: turvis-photos-r2
