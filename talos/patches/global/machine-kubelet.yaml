machine:
  kubelet:
    extraConfig:
      # Single-node cluster runs 130+ pods; default is 110. Was set out-of-band
      # on the node long ago — codified here 2026-08-13 so applies don't drop it
      maxPods: 500
      serializeImagePulls: false
      # Bound the pull burst when Flux reconciles many image bumps at once
      maxParallelImagePulls: 3
      # Defaults (85/80) let ~260Gi of stale images pile up at ~81% usage until
      # the 2026-08-09 DiskPressure emergency reclaim; GC routinely instead
      imageGCHighThresholdPercent: 70
      imageGCLowThresholdPercent: 60
    nodeIP:
      validSubnets:
        - 192.168.1.0/24
